gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server_tokens off;

map $arg_treat_as_download $media_disposition {
    "true"  "attachment";
    default "";
}

# Backend static + media
server {
    listen 8001;
    root /assets/backend;

    location /static/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET";
        add_header Access-Control-Allow-Headers "Content-Type";
        try_files $uri =404;
    }

    location /media/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Content-Disposition $media_disposition;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# Frontend (SPA)
server {
    listen 8002;
    root /assets/frontend;

    location / {
        try_files $uri /index.html;
    }
}

# CMS (SPA)
server {
    listen 8003;
    root /assets/cms;

    location / {
        try_files $uri /index.html;
    }
}
