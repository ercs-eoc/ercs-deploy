name: ercs-${PROJECT_ENVIRONMENT?error}

x-logging: &default_logging
  driver: journald
  options:
    tag: "{{.Name}}"

x-server: &base_server_setup
  build:
    context: ./backend/
  # Used for python debugging.
  stdin_open: true
  tty: true
  restart: unless-stopped
  logging: *default_logging
  environment: &base_server_environments
    APP_ENVIRONMENT: ${APP_ENVIRONMENT:-PROD}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    TIME_ZONE: ${BACKEND_TIME_ZONE:-UTC}
    # Postgres
    POSTGRES_HOST: ercs-${PROJECT_ENVIRONMENT}-postgres
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:-ercs}
    POSTGRES_USER: ${POSTGRES_USER?error}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?error}
    # Redis / Celery
    CELERY_REDIS_URL: redis://ercs-${PROJECT_ENVIRONMENT}-redis:6379/0
    CACHE_REDIS_URL: redis://ercs-${PROJECT_ENVIRONMENT}-redis:6379/1
    # Ollama
    LLM_OLLAMA_BASE_URL: http://ercs-${PROJECT_ENVIRONMENT}-ollama:11434
    # Storage
    MEDIA_ROOT: "/data/media"
    STATIC_ROOT: "/data/static"
    TEMP_DIR: "/data/temp"
    MEDIA_URL: "media/"
    STATIC_URL: "static/"
  env_file:
    - ./env/backend.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data/backend/static:/data/static
    - ./data/backend/media:/data/media
    - ./data/backend/temp:/data/temp
    - ./data/backend/internal:/data/internal
    - ipython_data_local:/root/.ipython/profile_default   # persist ipython data, including ipython history
  depends_on:
    - postgres
    - redis
    - ollama
  profiles:
    - core

x-worker: &base_worker_setup
  <<: *base_server_setup
  environment:
    <<: *base_server_environments
    APP_TYPE: "WORKER"

services:
  # Backend
  postgres:
    # NOTE: ercs-backend stores report embeddings in a pgvector VectorField
    image: pgvector/pgvector:0.8.1-pg17-trixie
    restart: unless-stopped
    logging: *default_logging
    environment:
      # NOTE: This config is only used for db first startup only
      POSTGRES_DB: ${POSTGRES_DB:-ercs}
      POSTGRES_USER: ${POSTGRES_USER?error}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?error}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - ercs-${PROJECT_ENVIRONMENT}-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - core

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    logging: *default_logging
    volumes:
      - redis_data:/data
    networks:
      default:
        aliases:
          - ercs-${PROJECT_ENVIRONMENT}-redis
    profiles:
      - core

  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    logging: *default_logging
    env_file:
      - ./env/backend.env

    entrypoint:
      - /bin/bash
      - /scripts/run_ollama.sh

    volumes:
      - ollama_models:/root/.ollama
      - ./scripts/run_ollama.sh:/scripts/run_ollama.sh:ro
    networks:
      default:
        aliases:
          - ercs-${PROJECT_ENVIRONMENT}-ollama

    healthcheck:
      # Healthy only once the startup pulls are done.
      test: ["CMD-SHELL", "ollama show $$LLM_MODEL_NAME >/dev/null && ollama show $$LLM_EMBEDDING_MODEL >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m

    deploy:
      resources:
        limits:
          memory: 16G
    profiles:
      - core


  web:
    <<: *base_server_setup
    environment:
      <<: *base_server_environments
      APP_TYPE: "WEB"
    command: bash -c "/code/deploy/run_prod.sh"
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK?error}
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-api.rule=Host(`${BACKEND_HOST?error}`)
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-api.entrypoints=websecure
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER?error}
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-api.service=ercs-${PROJECT_ENVIRONMENT}-backend-api
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-api.middlewares=ercs-${PROJECT_ENVIRONMENT}-backend-body-limit,ercs-${PROJECT_ENVIRONMENT}-backend-compress
      - traefik.http.services.ercs-${PROJECT_ENVIRONMENT}-backend-api.loadbalancer.server.port=80
      - traefik.http.middlewares.ercs-${PROJECT_ENVIRONMENT}-backend-body-limit.buffering.maxRequestBodyBytes=104857600 # 100MB upload limit
      - traefik.http.middlewares.ercs-${PROJECT_ENVIRONMENT}-backend-compress.compress=true

  worker:
    <<: *base_worker_setup
    command: bash -c  "/code/misc/prod/run_worker.sh"

  worker-beat:
    <<: *base_worker_setup
    command: bash -c "/code/misc/prod/run_worker_beat.sh"

  frontend:
    build:
      context: frontend/
      target: dev
    tty: true
    environment:
      APP_ENVIRONMENT: ${WEB_APP_ENVIRONMENT:-prod}
      APP_GRAPHQL_ENDPOINT: https://${BACKEND_HOST?error}/graphql/
      APP_GRAPHQL_CODEGEN_ENDPOINT: ./backend/schema.graphql
    command: sh -c 'pnpm generate:type && pnpm build'
    volumes:
      - ./data/web-builds/frontend:/code/build
    env_file:
      - ./env/frontend.env
    profiles:
      - web-builds

  cms:
    build:
      context: cms/
      target: dev
    tty: true
    environment:
      APP_ENVIRONMENT: ${WEB_APP_ENVIRONMENT:-prod}
      APP_GRAPHQL_ENDPOINT: https://${BACKEND_HOST?error}/graphql/
      APP_GRAPHQL_CODEGEN_ENDPOINT: ./backend/schema.graphql
    command: sh -c 'pnpm generate:type && pnpm build'
    volumes:
      - ./data/web-builds/cms:/code/build
    env_file:
      - ./env/cms.env
    profiles:
      - web-builds

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    logging: *default_logging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # -- Backend
      - ./data/backend/static:/assets/backend/static:ro
      - ./data/backend/media:/assets/backend/media:ro
      # -- Web apps
      - ./data/web-builds/frontend:/assets/frontend:ro
      - ./data/web-builds/cms:/assets/cms:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK?error}
      # Backend
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-static.rule=Host(`${BACKEND_HOST?error}`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-static.entrypoints=websecure
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-static.tls.certresolver=${TRAEFIK_CERT_RESOLVER?error}
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-backend-static.service=ercs-${PROJECT_ENVIRONMENT}-backend-static
      - traefik.http.services.ercs-${PROJECT_ENVIRONMENT}-backend-static.loadbalancer.server.port=8001
      # Frontend
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-frontend.rule=Host(`${FRONTEND_HOST?error}`)
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-frontend.entrypoints=websecure
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-frontend.tls.certresolver=${TRAEFIK_CERT_RESOLVER?error}
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-frontend.service=ercs-${PROJECT_ENVIRONMENT}-frontend
      - traefik.http.services.ercs-${PROJECT_ENVIRONMENT}-frontend.loadbalancer.server.port=8002
      # CMS
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-cms.rule=Host(`${CMS_HOST?error}`)
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-cms.entrypoints=websecure
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-cms.tls.certresolver=${TRAEFIK_CERT_RESOLVER?error}
      - traefik.http.routers.ercs-${PROJECT_ENVIRONMENT}-cms.service=ercs-${PROJECT_ENVIRONMENT}-cms
      - traefik.http.services.ercs-${PROJECT_ENVIRONMENT}-cms.loadbalancer.server.port=8003
    profiles:
      - core

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK?error}

volumes:
  redis_data:
  ipython_data_local:
  ollama_models:
